micronaut:
  server:
    port: -1
  application:
    banner:
      enabled: false
  aot:
    optimize-service-loading: false
    optimize-class-loading: false
    precompute-operations: false

filter:
  exclude:
    - renovate
    - dependabot

# Request directories and the startup sweep stay inside the build directory of the test run,
# never in the JVM temp directory that other processes use.
vulpes:
  release:
    work-dir: build/test-work
