# Test environment for the release endpoint and the Maven publisher.
# The fake backend and the fake Maven repository are controllers of the embedded
# server, so the URLs point at a fixed local port the tests can rely on.
micronaut:
  server:
    port: 18081

vulpes:
  backend:
    url: http://localhost:18081/fake-backend
    token: test-token
  content:
    maven:
      username: test-user
      password: test-secret
      releases-url: http://localhost:18081/fake-maven/repo/onelitefeather-releases
      snapshots-url: http://localhost:18081/fake-maven/repo/onelitefeather-snapshots
