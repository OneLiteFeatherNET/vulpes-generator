# Default values for vulpes-generator.
#
# This chart is a copy of charts/vulpes-backend, which is itself a fork of the
# generic `micronaut` chart in the cluster repository (Kubernetes-FLUX,
# helm/micronaut), taken so that each Vulpes service ships its own deployment
# alongside its image and the two are versioned from one release. `otis` still
# uses the original, so all three will drift; the
# template helpers here are deliberately still named `micronaut.*` and the
# files kept otherwise identical, which makes `diff -r` against
# Vulpes-Backend's charts/vulpes-backend (or helm/micronaut) the way to pull a
# later fix across.
#
# Only what identifies *this* application is changed from the original below
# (image, port, metrics path). Everything environment-specific -- hostnames,
# replica counts, database secrets, log labels -- stays in the cluster
# repository's overlays.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# Deployment update strategy. Empty -> Kubernetes default (RollingUpdate 25%/25%).
# For seamless updates with >=2 replicas, set maxUnavailable: 0 / maxSurge: 1.
strategy: {}
  # type: RollingUpdate
  # rollingUpdate:
  #   maxUnavailable: 0
  #   maxSurge: 1

# Scheduling priority. Empty -> cluster default PriorityClass.
priorityClassName: ""

# PodDisruptionBudget for the workload. Disabled by default so single-replica
# apps are unaffected. Set minAvailable OR maxUnavailable (minAvailable wins).
podDisruptionBudget:
  enabled: false
  minAvailable: ""
  maxUnavailable: ""

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: harbor.onelitefeather.dev/onelitefeather/vulpes-generator
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Left empty on purpose: it falls back to .Chart.AppVersion, which Release
  # Please moves together with the chart version. Setting it in an overlay
  # pins the image away from the chart it was released with -- and Spegel
  # caches mutable tags P2P, so "latest" is not an option here either.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# RBAC for Micronaut Kubernetes service discovery.
# When enabled, creates a namespace-scoped Role + RoleBinding granting the
# ServiceAccount read access to services and endpoints in the release namespace,
# as required by micronaut-kubernetes-discovery-client. Off by default.
rbac:
  create: false

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# Pod-level. Carried over from the vulpes-backend chart, where otis and
# vulpes-backend were verified with a probe pod: both reach Micronaut context
# startup as uid 1000 with a read-only root filesystem. Not yet re-verified
# against the vulpes-generator image -- it clones into Files.createTempDirectory,
# which the /tmp emptyDir below covers, but the first deploy should confirm it.
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  # The port the Micronaut server binds (micronaut.server.port), not the
  # chart's generic 80.
  port: 8080

# Micrometer's Prometheus endpoint, which this application exposes in every
# environment -- so it is on here rather than repeated in each overlay.
metrics:
  enabled: true
  path: /prometheus
  port: http
  scheme: http
  serviceMonitor:
    enabled: false
    namespace: ""
    additionalLabels: {}
    annotations: {}
    interval: ""
    scrapeTimeout: ""
    relabelings: []
    metricRelabelings: []

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: http
  hostnames:
  - chart-example.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
   limits:
     cpu: 1
     memory: 512Mi
   requests:
     cpu: 100m
     memory: 256Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# The flat shape is what templates/deployment.yaml reads (.path,
# .initialDelaySeconds, .periodSeconds) -- an httpGet: block here renders an
# empty path, which makes the kubelet fall back to "/" and fail every probe
# against a Micronaut app that only answers /health there.
livenessProbe:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10
readinessProbe:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10

# Off by default. Mainly needed when tracing.enabled: OTel bytecode
# instrumentation adds real seconds to JVM cold start (class transformation
# on Micronaut/Hibernate/Hikari), which can push first-successful-health
# past livenessProbe's steady-state deadline and SIGTERM-loop the pod
# before it ever finishes starting. Uses the readiness path/port since
# that's the only health endpoint the app exposes.
startupProbe:
  enabled: false
  failureThreshold: 30
  periodSeconds: 10

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Specific
profiles: ["prod"]  # This is for setting up the Micronaut application profiles.

# This section is for setting up the Micronaut application configuration.
config:
  base: |-
    micronaut:
      application:
        name: Vulpes Generator
  profiles:
    prod: |-
      # application-prod.yml
      logger:
        levels:
          root: INFO
    feature-x: |-
      # application-feature-x.yml
      feature:
        x: true

secrets:
  enabled: false
  files: {}
  # Example:
  # files:
  #   prod: |-
  #     datasource:
  #       username: ${DB_USER}
  #       password: ${DB_PASS}

# Environment-Variablen
env:
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=75.0 -Duser.timezone=UTC"

envFrom: []

# Traces-only OTel Java agent instrumentation. Metrics/logs already flow via
# the chart's own Prometheus scrape (metrics.serviceMonitor) and container
# stdout shipping, so only OTEL_TRACES_EXPORTER is enabled here to avoid
# duplicating either. An initContainer copies the javaagent jar out of the
# upstream image into an emptyDir the main container mounts read-only --
# no OpenTelemetry Operator/CRDs involved, just the jar-holder image it publishes.
tracing:
  enabled: false
  # Matches the tempo-gateway target already used by EnvoyProxy's native
  # tracing and the alloy-receiver OTLP gateway elsewhere in this cluster.
  endpoint: http://tempo-gateway.grafana.svc.cluster.local:4317
  # otis/vulpes-backend/vulpes-generator run JDK 25; older javaagent releases fail to attach
  # there (InaccessibleObjectException on ClassLoader.findLoadedClass --
  # module java.base doesn't opens java.lang to the unnamed module under
  # newer JDKs). 2.29.0 is the latest available and includes the JDK23+
  # MethodHandles.Lookup fix for boot-loader class injection.
  image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.30.0
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

containerSecurityContext:
  enabled: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
