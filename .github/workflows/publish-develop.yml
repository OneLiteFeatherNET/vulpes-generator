name: Publish develop image

# A container image only gets published today when release-please cuts a
# release, so a plain push to main with no release pending never reaches
# Harbor - and Flux on the cluster has nothing new to pull into the dev
# environment. This workflow publishes an image for every push to main,
# tagged develop-<committer-unix-ts>-<sha7>. The timestamp comes from the
# commit itself (`git show -s --format=%ct HEAD`), not the run, so a rerun of
# the same commit reproduces the same tag instead of minting a new one. Flux's
# ImagePolicy in Kubernetes-FLUX matches `^develop-(?P<ts>[0-9]+)-[0-9a-f]{7}$`
# and picks the newest tag numerically by ts.
#
# The shared docker-publish workflow derives semver tags - and the `latest`
# tag that riding along with them would enable - from a version that parses as
# semver (docker/metadata-action's type=semver rule silently produces no tag,
# and sets no `latest` flag, when it doesn't). A `develop-...` string is never
# valid semver, so this build only ever pushes its own tag plus the workflow's
# unconditional sha tag - it can't move `latest` or any release tag production
# pulls.
#
# The context build reuses the exact same Gradle command, context path and
# image name as release-please.yml's release build, so the dev image is built
# identically to a release image; only the version/tag differs. Pushes made by
# release-please itself (merging its own release PR, commit subject
# `chore(main): release ...`) are skipped here since release-please.yml
# already publishes a real release image for that same commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # keyless cosign signing

concurrency:
  # Unlike a release build, an in-flight dev build is safe to cancel: it's
  # superseded the moment a newer commit lands on main, so cancelling the
  # older run instead of queuing behind it keeps the dev tag close to HEAD.
  group: publish-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tag:
    name: Compute the develop tag
    if: |
      github.repository_owner == 'OneLiteFeatherNET' &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(main): release'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute tag
        id: tag
        run: |
          ts="$(git show -s --format=%ct HEAD)"
          sha7="$(git rev-parse --short=7 HEAD)"
          echo "version=develop-${ts}-${sha7}" >> "$GITHUB_OUTPUT"

  build-context:
    name: Build Docker context
    needs: tag
    if: github.repository_owner == 'OneLiteFeatherNET'
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-docker-context.yml@v2.9.1
    with:
      version: ${{ needs.tag.outputs.version }}
      gradle-command: "./gradlew jar optimizedBuildLayers optimizedDockerfile -Pversion=$VERSION"
      context-path: "build/docker/optimized"
      artifact-name: "docker-context-develop"
      java-version: "25.0.3"
      java-distribution: "temurin"
    secrets: inherit

  docker:
    name: Publish the image
    needs: [tag, build-context]
    if: github.repository_owner == 'OneLiteFeatherNET'
    permissions:
      contents: read
      id-token: write # keyless cosign signing via GitHub OIDC
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.9.1
    with:
      image-name: "onelitefeather/vulpes-generator"
      version: ${{ needs.tag.outputs.version }}
      context: "build/docker/optimized"
      artifact-name: "docker-context-develop"
      blob-chunk: "90000000" # ~90 MB, under the 100 MB Cloudflare cap
      req-concurrent: "4"
    secrets: inherit
