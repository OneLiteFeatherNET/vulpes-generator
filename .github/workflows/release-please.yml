name: release-please
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      docker_version:
        description: "Version to (re)build & push the Docker image for, e.g. 0.1.0 (no leading v). Runs only the docker job."
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ---- Maven publish ----
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-publish.yml@v2.8.1
    with:
      java-version: "25.0.3"
      java-distribution: "temurin"
    secrets: inherit

  # ---- Release Docker image (Gradle produces the context, docker-publish builds it) ----
  build-context:
    name: Build Docker context
    needs: release-please
    # On a real release, or on a manual dispatch to (re)publish a given version.
    if: |
      always() &&
      ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
       github.event_name == 'workflow_dispatch')
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-docker-context.yml@v2.8.1
    with:
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.docker_version || needs.release-please.outputs.version }}
      gradle-command: "./gradlew jar optimizedBuildLayers optimizedDockerfile -Pversion=$VERSION"
      context-path: "build/docker/optimized"
      artifact-name: "docker-context-release"
    secrets: inherit

  docker:
    name: Build Docker Artifacts
    needs: [release-please, build-context]
    permissions:
      contents: read
      id-token: write   # keyless cosign signing via GitHub OIDC
    if: |
      always() && needs.build-context.result == 'success' &&
      ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
       github.event_name == 'workflow_dispatch')
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.8.1
    with:
      image-name: "onelitefeather/vulpes-generator"
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.docker_version || needs.release-please.outputs.version }}
      context: "build/docker/optimized"
      artifact-name: "docker-context-release"
      blob-chunk: "90000000"   # ~90 MB, under the 100 MB Cloudflare cap
      req-concurrent: "4"
    secrets: inherit

  # Chained into this run rather than triggered by the tag: release-please tags
  # with GITHUB_TOKEN, and a tag pushed that way starts no `on: push: tags`
  # workflow. The release is also the only place that already knows the
  # version, so nothing has to derive one.
  #
  # Charts are published on a release only. A branch build is deployed by
  # pointing an existing release of the chart at the branch's image tag, which
  # needs no chart of its own.
  helm:
    name: Publish the Helm chart
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      # Both versions come from the release rather than from Chart.yaml.
      # Release Please keeps that file current anyway, but stating them here
      # makes a mismatch impossible instead of something to check for: the
      # chart cannot be packaged pointing at an image tag nobody built.
      - name: Package
        run: helm package charts/vulpes-generator --destination dist --version "${{ needs.release-please.outputs.version }}" --app-version "${{ needs.release-please.outputs.version }}"

      - name: Log in to OneLiteFeather Harbor
        env:
          REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          USERNAME: ${{ secrets.HARBOR_USERNAME }}
          PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: printf '%s' "$PASSWORD" | helm registry login "$REGISTRY" --username "$USERNAME" --password-stdin

      # Into the same Harbor project as the image, under charts/ - the layout
      # apus and stelaris-ui already use, so a Flux OCIRepository pointing here
      # looks like every other one in the cluster repository.
      - name: Push
        env:
          REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: helm push "dist/vulpes-generator-${VERSION}.tgz" "oci://${REGISTRY}/onelitefeather/charts"

      - name: Log out
        if: always()
        env:
          REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
        run: helm registry logout "$REGISTRY" || true
